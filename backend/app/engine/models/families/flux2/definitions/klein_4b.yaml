id: flux2-klein-base-4b
family: flux2
name: Flux 2 (Klein Base 4B)
version: '1.0'
defaults:
  resolution: 1024
  scheduler: euler_a
  learning_rate: 1e-5
  # Native in-training-preview defaults, definition-sourced (W3-1). These are
  # Flux2KleinPipeline.__call__'s own defaults (pipeline_flux2_klein.py:620/622:
  # num_inference_steps=50, guidance_scale=4.0) — NOT the generic base's 20
  # steps / 3.5 guidance. The flux2 trainer does not read `guidance_scale` from
  # config, so sourcing it is safe. Explicit per-prompt values win.
  num_inference_steps: 50
  guidance_scale: 4.0
components:
  repo:
    path: huggingface:black-forest-labs/FLUX.2-klein-base-4B
    type: diffusers
    params: {}
model_size_mb:
  transformer: 7750
  text_encoder: 8050
  vae: 335
detected_precision:
  text_encoder: torch.bfloat16
  vae: torch.bfloat16
  unet: torch.bfloat16
architecture_params:
  # Partially populated — enrichment will fill from HF repo config.json
  transformer.hidden_size: 3072
  transformer.num_attention_heads: 24
  transformer.in_channels: 128
