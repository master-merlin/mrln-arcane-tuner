<div class="training-grid">

    <!-- ── LEFT · Sections TOC (bordered bar, not a card — per Hi-Fi) ── -->
    <aside class="ts-toc">
        <app-training-toc
            [segments]="segments()"
            [activeId]="activeSection()"
            (jump)="onJump($event)"/>
    </aside>

    <!-- ── CENTER · Page head + dynamic config form ───────────────── -->
    <main class="ts-form-pane" #formPane (scroll)="onPaneScroll()"
          [style.paddingBottom.px]="overscrollPx()">
        <div class="page-head ts-page-head">
            <div>
                <div class="eyebrow">CONFIGURE</div>
                <h1 class="page-title">Training</h1>
                <p class="page-sub">Set up and queue a training run.</p>
            </div>
        </div>

        @if (currentSchema()) {
            <app-training-dynamic-config
                [schema]="currentSchema()"
                [availableModels]="availableModels()"
                [projectId]="scope.projectId()"
                (segmentsChanged)="onSegmentsChanged($event)"
                (estimateChanged)="onEstimate($event)"
                (configSubmitted)="queueJob($event)"/>
        } @else if (loading()) {
            <!-- Form skeleton: section-shaped placeholders approximating the
                 config sections so a slow first load reads as a loading form,
                 not an empty/broken page. aria-hidden + a polite status line
                 for assistive tech. -->
            <div class="ts-skeleton" data-testid="training-skeleton" aria-hidden="true">
                @for (section of [0, 1, 2]; track section) {
                    <div class="tsk-card">
                        <div class="tsk-bar tsk-title"></div>
                        <div class="tsk-row">
                            <div class="tsk-bar tsk-label"></div>
                            <div class="tsk-bar tsk-field"></div>
                        </div>
                        <div class="tsk-row">
                            <div class="tsk-bar tsk-label"></div>
                            <div class="tsk-bar tsk-field"></div>
                        </div>
                        <div class="tsk-row">
                            <div class="tsk-bar tsk-label"></div>
                            <div class="tsk-bar tsk-field"></div>
                        </div>
                    </div>
                }
            </div>
            <p class="sr-only" role="status">Loading training configuration…</p>
        } @else {
            <p class="muted ts-empty">Training configuration is unavailable. Please retry.</p>
        }
    </main>

    <!-- ── RIGHT · Estimate wall (shared with Quick Train) + VRAM detail ── -->
    <aside class="ts-estimate-rail">
        <!-- Card 1: same wall as Quick Train (wall time / throughput / VRAM / output / disk) -->
        <app-estimate-wall
            [estimate]="estimate()"
            [ready]="estimateReady()"
            [recomputing]="recomputing()"
            emptyText="Choose a model to estimate."
            (updateStats)="updateStats()" />

        <!-- Card 2: detailed per-component VRAM breakdown.
             No card-body padding: the hero KPI tile spans the full card width
             (consistent with the wall tiles); the rail pads its own sections. -->
        <div class="card">
            <app-training-estimate-rail [report]="vramReport()"/>
        </div>
    </aside>

</div>
