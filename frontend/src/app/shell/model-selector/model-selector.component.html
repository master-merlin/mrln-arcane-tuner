<!-- frontend/src/app/shell/model-selector/model-selector.component.html -->
<div class="flex items-center gap-2 text-xs">
    <button
        type="button"
        role="switch"
        [attr.aria-checked]="ctx.modelAware()"
        (click)="toggleModelAware(!ctx.modelAware())"
        data-testid="model-aware-toggle"
        title="Model-aware captions"
        class="relative inline-flex h-4 w-7 shrink-0 items-center rounded-full transition-colors cursor-pointer"
        [class.bg-brand]="ctx.modelAware()"
        [class.bg-surface-high]="!ctx.modelAware()"
    >
        <span
            class="inline-block h-3 w-3 rounded-full bg-white transition-transform"
            [style.transform]="ctx.modelAware() ? 'translateX(14px)' : 'translateX(2px)'"
        ></span>
    </button>
    <span class="text-text-subtle select-none">Model-aware</span>

    @if (ctx.modelAware()) {
        <select
            class="bg-surface-mid border border-surface-high rounded-theme-md px-2 py-1"
            [ngModel]="selectedFamily()"
            (ngModelChange)="onFamilyChange($event)"
            data-testid="family-select"
        >
            <option value="">Family…</option>
            @for (fam of families(); track fam) {
                <option [value]="fam">{{ fam }}</option>
            }
        </select>

        @if (selectedFamily()) {
            <select
                class="bg-surface-mid border border-surface-high rounded-theme-md px-2 py-1"
                [ngModel]="ctx.activeDefinitionId()"
                (ngModelChange)="onDefinitionChange($event)"
                data-testid="definition-select"
            >
                <option [ngValue]="null">Definition…</option>
                @for (d of familyDefinitions(); track d.id) {
                    <option [value]="d.id">{{ d.name }}</option>
                }
            </select>
        }
    }
</div>
