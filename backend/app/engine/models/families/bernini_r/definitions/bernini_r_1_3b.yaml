# Bernini-R 1.3B (ByteDance) — renderer-only VIDEO-EDIT (v2v) LoRA definition.
#
# Recon: .agent/workdir/bernini-r-recon.md (upstream repo bytedance/Bernini @
# d111e3546f40407ff5326259c87e2a0e1416e583). The 1.3B renderer is Wan2.1-1.3B
# geometry (30 layers / 12 heads × 128 / ffn 8960 / patch [1,2,2], in=out=16ch)
# with a UMT5-XXL text encoder and the standard Wan2.1 16-ch VAE — Bernini adds
# ZERO new weight modules; its ONLY novelty is data-side (token-concat of clean
# condition-video latents + a per-stream ``source_id`` rope). So the shards load
# into stock diffusers 0.39 ``WanTransformer3DModel`` and the LoRA key surface is
# wan-canonical (recon §1/§9).
#
# NO model_index.json — the repo root is a transformers-style bernini_renderer
# config; :class:`BerniniRLoader` loads components by subfolder (recon ops
# footnote). Single expert (``skip_transformer_2: true``); the 14B dual-expert
# MoE is a later extension.
#
# CONFIG PINS (deliberate divergences from the checkpoint's own config):
#  - scheduler.flow_shift: 5.0 — the v2v sampling/training shift (upstream
#    ``shift_config`` v2v = 5.0 and ``GEN_Wanx22.sample()`` default flow_shift
#    5.0). The HF ``scheduler_config.json`` / root config ship 3.0 (the t2v
#    value), so enrichment-from-real-load would clobber 5.0 → pinned via
#    ``enrich_pinned_keys`` (ace scheduler.shift clobber precedent).
#  - defaults.mode_scale: 1.29 / defaults.timestep_shift: 5.0 — the trainer's
#    SD3-``mode`` timestep recipe (recon §4). The GENERIC ``mode_scale`` schema
#    field defaults to 1.5 for ``timestep_sampling: mode``; without this pin a
#    materialized generic default would silently override the bernini value
#    (BR3 review action item).
id: bernini-r-1.3b
family: bernini_r
name: Bernini-R 1.3B (Video Edit)
version: '1.0'
# Paired video-edit (v2v): trains on a control ("source") VIDEO + an instruction
# caption; the control rides as a clean token stream (source_id=1), the target
# video is the denoised stream (source_id=0).
control_inputs: 1
defaults:
  resolution: 480
  scheduler: flow_match_euler
  learning_rate: 1.0e-4
  # SD3 ``mode`` timestep weighting + per-task shift (v2v). The trainer's
  # ``sample_timesteps`` reads both; pinned here so the generic ``mode_scale``
  # default (1.5) can never override the bernini value.
  timestep_sampling: mode
  mode_scale: 1.29
  timestep_shift: 5.0
  # v2v inference defaults (upstream ``BerniniRendererPipeline.__call__`` /
  # ``GEN_Wanx22.sample()`` — recon §5).
  num_inference_steps: 40
  guidance_scale: 4.0
  num_frames: 81
  fps: 16
  height: 480
  width: 832
components:
  repo:
    path: huggingface:ByteDance/Bernini-R-1.3B-Diffusers
    type: diffusers
    params: {}
# scheduler.flow_shift is a DELIBERATE v2v pin (5.0) — the repo config ships 3.0
# (the t2v value) and enrichment must not clobber it.
enrich_pinned_keys:
- scheduler.flow_shift
detected_precision:
  text_encoder: torch.bfloat16
  vae: torch.float32
  unet: torch.bfloat16
architecture_params:
  mode: t2v
  # -- Transformer (Wan2.1-1.3B geometry; stock WanTransformer3DModel keys) --
  transformer._class_name: WanTransformer3DModel
  transformer.in_channels: 16
  transformer.out_channels: 16
  transformer.num_layers: 30
  transformer.num_attention_heads: 12
  transformer.attention_head_dim: 128
  transformer.hidden_size: 1536
  transformer.ffn_dim: 8960
  transformer.text_dim: 4096
  transformer.freq_dim: 256
  transformer.cross_attn_norm: true
  transformer.qk_norm: rms_norm_across_heads
  transformer.eps: 1.0e-06
  transformer.rope_max_seq_len: 1024
  transformer.patch_size:
  - 1
  - 2
  - 2
  # -- Text encoder (UMT5-XXL) --
  te.model_type: umt5
  te.max_length: 512
  # -- VAE (Wan 2.1, z=16, 8× spatial / 4× temporal) --
  vae._class_name: AutoencoderKLWan
  vae.z_dim: 16
  # -- Video contract (4n+1 frame rule, 16 fps native) --
  video.frame_rule: 4n+1
  video.native_fps: 16
  video.vae_spatial: 8
  video.vae_temporal: 4
  # -- Scheduler (native UniPC, flow_prediction; flow_shift pinned to v2v 5.0) --
  scheduler._class_name: UniPCMultistepScheduler
  scheduler.prediction_type: flow_prediction
  scheduler.use_flow_sigmas: true
  scheduler.flow_shift: 5.0
  scheduler.num_train_timesteps: 1000
  # Generic activation-estimate hints (VRAM estimator).
  hidden_size: 1536
  num_heads: 12
  depth: 30
  in_channels: 16
model_size_mb: {}
# Bernini adds ZERO new weight modules → the wan2.1 T2V canonical target set
# verbatim (recon §9). MUST stay non-empty (enrichment only auto-fills an EMPTY
# list; dreamlite 2026-07-08 precedent).
lora_targetable_modules:
- attn1.to_q
- attn1.to_k
- attn1.to_v
- attn1.to_out.0
- attn2.to_q
- attn2.to_k
- attn2.to_v
- attn2.to_out.0
- ffn.net.0.proj
- ffn.net.2
block_topology: []
