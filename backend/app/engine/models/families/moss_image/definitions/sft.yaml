# MOSS-Image-SFT (LANE-165). Fine-tuned from MOSS-Image-Base "on curated data" with the same
# architecture and inference pipeline (byte-identical configs and pipeline file at both pins) -- the
# family's SECONDARY LoRA target. Known model property: faint, evenly spaced vertical colour stripes
# in flat areas (community analysis, layers 37-41), not a training defect.
# This file differs from base.yaml ONLY in id, name and the pinned repo revision
# (test_moss_image_definition_defaults holds the two files to that).
id: moss-image-sft
family: moss_image
name: MOSS-Image (SFT)
version: '1.0'
# Apache License 2.0, ungated. Tracked in the README "licensed separately" table (the `moss_image`
# row), never here or in the app (RULE-21; the README link reads the repo below).
defaults:
  # Research §1.6: 1M-2M total pixels recommended, H and W multiples of 16.
  resolution: 1024
  scheduler: flow_match
  # Assumption (LANE-165): a conventional LoRA learning rate for a ~5B DiT; judged at the GPU UAT.
  learning_rate: 1e-4
  # The model card's inference defaults: 50 steps, real CFG 3.0 (range 3-6), shift 5, Euler.
  num_inference_steps: 50
  guidance_scale: 3.0
  is_distilled: false
components:
  repo:
    # Pinned 40-hex HF revision: a two-day-old release whose pipeline file may still change.
    path: huggingface:OpenMOSS-Team/MOSS-Image-SFT@fc5de0d56fc910cbca6f6625a70f5f582b26deb1
    type: diffusers
    params: {}
control_inputs: 0
# On-disk sizes (bf16 transformer + text encoder, fp32 VAE) from the repo's file listing at the pin.
model_size_mb:
  transformer: 10165
  text_encoder: 16785
  vae: 250
detected_precision:
  text_encoder: torch.bfloat16
  vae: torch.float32
  unet: torch.bfloat16
architecture_params:
  transformer._class_name: MOSSImageTransformer
  transformer.dim: 3072
  transformer.ffn_dim: 8192
  transformer.num_heads: 24
  transformer.num_layers: 42
  transformer.text_dim: 4096
  transformer.freq_dim: 256
  transformer.latent_channels: 128
  transformer.rope_base: 10000.0
  hidden_size: 3072
  num_heads: 24
  depth: 42
  in_channels: 128
  context_dim: 4096
  vae._class_name: AutoencoderKLFlux2
  vae.latent_channels: 32
  vae.batch_norm_eps: 0.0001
  vae.patch_size:
  - 2
  - 2
  vae.block_out_channels:
  - 128
  - 256
  - 512
  - 512
  vae.decoder_block_out_channels:
  - 96
  - 192
  - 384
  - 384
  te.type: qwen3_5
  te.model_type: qwen3_5
  # Research §1.5: each caption alone through the Qwen chat template (add_generation_prompt,
  # enable_thinking=True), truncated at 4096 tokens, the final-layer 4096-wide hidden state.
  te.max_length: 4096
  te.enable_thinking: true
  # The checkpoint's scheduler_config.json: inference shift 5.0 on the 1000-step grid, no dynamic shift.
  scheduler.shift: 5.0
  # Opt-in (ECOSYSTEM section 6): a NEW sample-prompt row in the training form is seeded with this
  # definition's own steps / guidance / size (50 / 3.0 / 1024) instead of the fixed 20 / 3.5 / 1024.
  sampling.seed_prompt_defaults: true
  scheduler.use_dynamic_shifting: false
  scheduler.num_train_timesteps: 1000
  # Family DEFAULT timestep draw, read by the trainer and used only where the run config names no
  # `timestep_sampling` (a key the config carries is never touched; the shared TimestepSampler is the
  # path for every mode). The technical report's final-stage schedule is S = 1 - sigmoid(Z),
  # Z ~ N(-1.09, 0.95^2); in the factory's convention (sigma 1 = noise, sigmoid(N(mu, std))) that is
  # mu +1.09, std 0.95.
  timestep.default_mode: logit_normal
  timestep.logit_normal_mu: 1.09
  timestep.logit_normal_sigma: 0.95
  # The model card's negative-branch block skip (uncond_skip_layers=(22,), zero-based).
  sampler.uncond_skip_layers:
  - 22
# Research §3.2: the six bias-free projections of each of the 42 blocks = 252 modules (kohya's default
# set; modulation, norms, video_embedder, time embedding, text_embedder and the final layer are not
# targets). Native names -- the saver writes them as diffusion_model.<name>.lora_A/B.weight.
# scheduler.shift is the checkpoint's inference grid shift (model card, 5.0); the repo's
# scheduler_config.json harvests 1.0 and enrichment must not replace it (LANE-167, UAT 2026-10-20).
enrich_pinned_keys:
- scheduler.shift
