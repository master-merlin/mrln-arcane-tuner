<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    // Apply the persisted theme before first paint so a returning light-mode
    // user never sees a flash of the dark theme. Mirrors ThemeStore's key.
    (function () {
      try {
        if (localStorage.getItem('mrln.theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* storage unavailable — fall through to dark default */ }
    })();
  </script>
  <style>
    /* Keep the pre-bootstrap loading splash in sync with a saved light theme
       (its inline style hardcodes a black background). */
    html[data-theme="light"] #app-loading { background: #ffffff !important; color: #0e0f13 !important; }
  </style>
</head>
<body>
  <app-root>
    <div id="app-loading" style="background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace;">
        <h1>MRLN Arcane Tuner Loading...</h1>
        <div id="app-error" style="color: red; white-space: pre-wrap; margin-top: 20px; padding: 20px; border: 1px solid red; display: none; max-width: 80%;"></div>
    </div>
  </app-root>
</body>
</html>
