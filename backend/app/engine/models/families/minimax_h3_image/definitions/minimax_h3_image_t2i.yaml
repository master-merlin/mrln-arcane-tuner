enrich_pinned_keys:
- timestep.default_mode
- timestep.fixed_sigmas
# Attention q/k/v/out and the SwiGLU FFN of every main and refiner block (the video family's
# portable scope). The AdaLN branch, the stems and the 6 output heads are not targets. The saver
# writes these in the native layout (lora_keys.py: attn.qkv_proj fused, attn.out_proj, mlp.fc1,
# mlp.fc2).
lora_targetable_modules:
- attn.to_q
- attn.to_k
- attn.to_v
- attn.to_out.0
- ff.net.0.proj
- ff.net.2
# approx_vram_mb = bf16 bytes of ONE block, from the vendored class built on the meta device from
# transformer_diffusers/config.json: 645,571,840 parameters per transformer block, 385,362,688 per
# refiner block (the refiner has no AdaLN projection). The refiners are NESTED under token_refiner.
block_topology:
- name: transformer_blocks
  attr_path: transformer_blocks
  count: 50
  approx_vram_mb: 1231
- name: token_refiner_blocks
  attr_path: token_refiner.refiner_blocks
  count: 2
  approx_vram_mb: 735
