<div class="page-head">
    <div>
        <div class="eyebrow">SYSTEM</div>
        <h1 class="page-title">Server Control</h1>
        <p class="page-sub">Manage the backend instance, settings &amp; logs.</p>
    </div>
    <div class="page-head-actions">
        <button type="button" class="btn" (click)="system.requestRestart()">
            <app-ico name="RotateCw" [size]="14" /> Restart server
        </button>
    </div>
</div>

<!-- Health KPI rail — fed by GET /system/health + the live WS connection -->
<div class="server-kpi-rail">
    <app-kpi-tile label="STATUS" [value]="statusValue()" [accent]="statusAccent()" [sub]="statusSub()"/>
    <app-kpi-tile label="UPTIME" [value]="uptimeValue()" accent="brand" sub="this process"/>
    <app-kpi-tile label="MODELS" [value]="modelsValue()" accent="teal" sub="definitions"/>
    <app-kpi-tile label="ACTIVE JOBS" [value]="activeJobsValue()" accent="warning" sub="running + paused"/>
</div>

<!-- Settings: Connection + Models cards (rendered by server-control) -->
<app-server-control />

<!-- LLM refine endpoint config (Ollama / LM Studio) -->
<app-llm-endpoint-settings />

<!-- Server logs (the viewer renders its own Hi-Fi card) -->
<div class="server-logs-slot">
    <app-live-log-viewer />
</div>
