  vae.out_channels: 3
  vae.upsample_fn: nearest
  vae.upsampling_scaling_factor: 2
block_topology:
- name: down_blocks
  attr_path: down_blocks
  count: 3
  approx_vram_mb: 100
- name: mid_block
  attr_path: mid_block
  count: 1
  approx_vram_mb: 100
- name: up_blocks
  attr_path: up_blocks
  count: 3
  approx_vram_mb: 100
# Curated LoRA target surface (attention + feed-forward Linears ONLY, 312
# modules = 624 lora_A/B keys — pinned by test_dreamlite_lora_portability).
