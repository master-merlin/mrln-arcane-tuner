# MiniMax-H3-Image: the MiniMax-H3 33B single-stream DiT without its audio stream, distilled to
# 6 sampling steps with no CFG and one output head per step (pdd_proj_out[0..5]). Text-to-image
# only. It is NOT the minimax_h3 video family: no audio, no frames, no dual shift, no 17n+5 rule;
# the code both share lives in minimax_h3_shared.
# MiniMax-H3-Image Community License; tracked in the README "licensed separately" table, never
# here or in the app.
#
# The model classes are VENDORED (vendor/README.md): diffusers 0.41.0 ships none of them. The
# family loads transformer_diffusers/ and vae_diffusers/; the transformer/ and vae/ folders hold
# the model's native configs, which the enricher harvests (the four config files of
# MiniMaxAI/MiniMax-H3-Image at fbde899f are the fixture of
# test_minimax_h3_image_definition_enricher_fixed_point.py).
id: minimax-h3-image-t2i
family: minimax_h3_image
name: MiniMax-H3-Image (text -> image)
version: '1.0'
defaults:
  # One latent token covers 32x32 px; the default training area is about 1 MP, as DiffSynth-Studio
  # trains. Previews run on the reference canvas (at least 4 MP) and are resized back.
  resolution: 1024
  scheduler: flow_match
  learning_rate: 1e-4
  # Every weight ships bf16 and the trainer refuses any other training precision at setup.
  mixed_precision: bf16
  # The distilled grid: 6 steps, no guidance. The sampler ignores any other count or scale.
  num_inference_steps: 6
  guidance_scale: 1.0
  is_distilled: true
  # timestep_sampling / fixed_sigmas are NOT stated here: resolve_capabilities derives them from
  # timestep.default_mode / timestep.fixed_sigmas below, so the form default and the job default
  # are one value.
components:
  repo:
    path: huggingface:MiniMaxAI/MiniMax-H3-Image@fbde899f
    type: diffusers
    params: {}
control_inputs: 0
detected_precision:
  text_encoder: torch.bfloat16
  vae: torch.float32
  unet: torch.bfloat16
# On-disk component sizes (MiB = bytes / 1024^2) at fbde899f: the transformer_diffusers and
# text_encoder safetensors index files' metadata.total_size (66,289,356,032 and 66,714,780,128
# bytes), and vae_diffusers' single float32 safetensors file (2,336,973,400 bytes). The estimator
# prefers these over its _FAMILY_PARAMS["minimax_h3_image"] fallback (kept in sync).
model_size_mb:
  transformer: 63218.46
  text_encoder: 63624.17
  vae: 2228.71
architecture_params:
  mode: t2i
  # Generic activation-estimate hints.
  hidden_size: 5376
  depth: 52
  in_channels: 24
  context_dim: 5120
  num_heads: 56
  # The text tap (minimax_h3_shared.text): Qwen3-VL hidden_states[50], NOT the last layer, the
  # prompt verbatim without special tokens, at most 4096 tokens.
  te.type: qwen3_vl
  te.hidden_size: 5120
  te.hidden_state_tap_index: 50
  te.max_length: 4096
  # Opt-in: a NEW sample-prompt row in the training form is seeded with this definition's own
  # steps / guidance / size (6 / 1.0 / 1024) instead of the fixed 20 / 3.5 / 1024.
  sampling.seed_prompt_defaults: true
  # Family DEFAULT timestep draw, read by the trainer and used only where the run config names no
  # `timestep_sampling` (a mode the config carries is never touched). The model trains on its
  # sampling schedule, each head only on its own sigma (ostris/ai-toolkit 5b1670a5,
  # minimax_h3_image.py: "Training draws only the 6 sampling sigmas"): a uniform draw from the
  # head grid. Any other mode uses the head of the nearest grid sigma (DiffSynth-Studio 6ccfd64d).
  timestep.default_mode: fixed_sigmas
  # The head grid, head i at index i: modular_model_index.json `sample_sigmas` at fbde899f without
  # the terminal 0.0 (not a training level). The sampler runs exactly these 6 steps, unshifted.
  timestep.fixed_sigmas:
  - 1.0
  - 0.9675236940383911
  - 0.8875485062599182
  - 0.75
  - 0.5327739119529724
  - 0.23200887441635132
  # -- Harvested by the enricher, verbatim, from the native transformer/, text_encoder/,
  #    scheduler/ and vae/ configs at fbde899f (the loader reads the *_diffusers folders) --
  transformer._class_name: MiniMaxH3DiTModel
  transformer.hidden_size: 5376
  transformer.num_layers: 50
  transformer.token_refiner_num_layers: 2
  transformer.num_attention_heads: 56
  transformer.attention_head_dim: 128
