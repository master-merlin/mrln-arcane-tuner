# CONTROLLER-PINNED scope: attention + shared/dense FFN nn.Linear modules
# ONLY. The MoE router gate (NucleusMoELayer.gate) is deliberately EXCLUDED
# — see driver.py module docstring §7 for the full rationale. This list
# MUST match NucleusImageDriver.get_lora_targets() exactly (enforced by
