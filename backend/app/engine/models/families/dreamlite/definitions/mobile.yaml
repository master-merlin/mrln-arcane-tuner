id: dreamlite-mobile
family: dreamlite
name: DreamLite Mobile
version: '1.0'
control_inputs: 0
defaults:
  resolution: 1024
  scheduler: flow_match
  learning_rate: 1e-4
  # Mobile = the CFG-distilled checkpoint: 4 steps, guidance ignored.
  is_distilled: true
  guidance_scale: 0
  num_inference_steps: 4
components:
  repo:
    # BOTH DreamLite repos carry the diffusers layout on the "diffusers"
    # branch (the pipeline docs' canonical revision) — the @revision suffix
    # is resolved by ModelPathResolver.
    path: huggingface:carlofkl/DreamLite-mobile@diffusers
    type: diffusers
    params: {}
detected_precision:
  text_encoder: torch.bfloat16
  vae: torch.bfloat16
  unet: torch.bfloat16
# model_size_mb intentionally empty — the VRAM estimator falls back to the
# meta-instantiated param counts in _FAMILY_PARAMS["dreamlite"].
architecture_params:
  # -- UNet (checkpoint unet/config.json, revision="diffusers") --
  # NOTE: this is a U-Net (DreamLiteUNetModel extends UNet2DConditionModel),
  # NOT a DiT. attention_head_dim is per-level and — per the historical
  # UNet2DConditionModel naming bug — actually means NUM HEADS, giving
  # head_dim = block_out // heads = 64 at every level. With num_kv_heads=1
  # (MQA) every to_k/to_v projection is 64-wide.
  unet._class_name: DreamLiteUNetModel
  unet.sample_size: 128
  unet.in_channels: 4
  unet.out_channels: 4
  unet.block_out_channels:
  - 256
  - 512
  - 896
  unet.attention_head_dim:
  - 4
  - 8
  - 14
  unet.cross_attention_dim: 2304
  unet.layers_per_block: 2
  unet.transformer_layers_per_block:
  - 1
  - 2
  - 4
  unet.use_linear_projection: true
  unet.encoder_hid_dim: 2048
  unet.encoder_hid_dim_type: text_proj_rms
  unet.addition_embed_type: time
  unet.addition_time_embed_dim: 256
  unet.projection_class_embeddings_input_dim: 512
  unet.num_kv_heads: 1
  unet.qk_norm: rms_norm
  unet.ff_mult: 3
  unet.use_sep_conv: true
  unet.norm_num_groups: 32
  unet.supports_cfg: true
  unet.supports_negative_prompt: true
  # Generic activation-estimate hints (widest level 896, 36 transformer blocks)
  hidden_size: 896
  depth: 36
  in_channels: 4
  # -- Text encoder (checkpoint text_encoder/config.json: Qwen3-VL, ~2.1B) --
  te.type: qwen3_vl
  te.architectures:
  - Qwen3VLForConditionalGeneration
  te.hidden_size: 2048
  te.intermediate_size: 6144
  te.num_hidden_layers: 28
  te.num_attention_heads: 16
  te.num_key_value_heads: 8
  te.head_dim: 128
  te.rope_theta: 5000000
  te.rms_norm_eps: 1.0e-06
  te.tie_word_embeddings: true
  te.vocab_size: 151936
  # DreamLitePipeline prompt-template contract: tokenizer max_length =
  # max_sequence_length + drop_idx; the first drop_idx hidden states
  # (chat-template prefix) are dropped from the encoder output.
  te.max_sequence_length: 200
  te.drop_idx: 34
  # -- Scheduler (checkpoint scheduler/scheduler_config.json) --
  scheduler._class_name: FlowMatchEulerDiscreteScheduler
  scheduler.num_train_timesteps: 1000
  scheduler.shift: 3.0
  scheduler.use_dynamic_shifting: true
  scheduler.base_shift: 0.5
  scheduler.max_shift: 1.15
  scheduler.base_image_seq_len: 256
  scheduler.max_image_seq_len: 4096
  # -- VAE (checkpoint vae/config.json — AutoencoderTiny / taesdxl) --
  vae._class_name: AutoencoderTiny
  vae.latent_channels: 4
  vae.vae_scale_factor: 8
  vae.scaling_factor: 1.0
  vae.shift_factor: 0.0
  context_dim: 2304
  sample_size: 128
  transformer._class_name: DreamLiteUNetModel
  transformer.act_fn: silu
  transformer.addition_embed_type: time
  transformer.addition_embed_type_num_heads: 64
  transformer.addition_time_embed_dim: 256
  transformer.attention_head_dim:
  - 4
  - 8
  - 14
  transformer.attention_type: default
  transformer.block_out_channels:
  - 256
  - 512
  - 896
  transformer.center_input_sample: false
  transformer.class_embed_type:
  transformer.class_embeddings_concat: false
  transformer.conv_in_kernel: 3
  transformer.conv_out_kernel: 3
  transformer.cross_attention_dim: 2304
  transformer.cross_attention_norm:
  transformer.down_block_types:
  - DreamLiteCrossAttnNoSelfAttnDownBlock2D
  - DreamLiteCrossAttnNoSelfAttnDownBlock2D
  - DreamLiteCrossAttnDownBlock2D
  transformer.downsample_padding: 1
  transformer.dropout: 0.0
  transformer.dual_cross_attention: false
  transformer.encoder_hid_dim: 2048
  transformer.encoder_hid_dim_type: text_proj_rms
  transformer.ff_mult: 3
  transformer.flip_sin_to_cos: true
  transformer.freq_shift: 0
  transformer.in_channels: 4
  transformer.layers_per_block: 2
  transformer.mid_block_only_cross_attention:
  transformer.mid_block_scale_factor: 1
  transformer.mid_block_type: DreamLiteUNetMidBlock2DCrossAttn
  transformer.norm_eps: 1.0e-05
  transformer.norm_num_groups: 32
  transformer.num_attention_heads:
  transformer.num_class_embeds:
  transformer.num_kv_heads: 1
  transformer.num_mid_layers: 1
  transformer.only_cross_attention: false
  transformer.out_channels: 4
  transformer.projection_class_embeddings_input_dim: 512
  transformer.qk_norm: rms_norm
  transformer.resnet_out_scale_factor: 1.0
  transformer.resnet_skip_time_act: false
  transformer.resnet_time_scale_shift: default
  transformer.reverse_transformer_layers_per_block:
  transformer.sample_size: 128
  transformer.time_cond_proj_dim:
  transformer.time_embedding_act_fn:
  transformer.time_embedding_dim:
  transformer.time_embedding_type: positional
  transformer.timestep_post_act:
  transformer.transformer_layers_per_block:
  - 1
  - 2
  - 4
  transformer.up_block_types:
  - DreamLiteCrossAttnUpBlock2D
  - DreamLiteCrossAttnNoSelfAttnUpBlock2D
  - DreamLiteUpBlock2D
  transformer.upcast_attention:
  transformer.use_linear_projection: true
  transformer.use_sep_conv: true
  te.dtype: bfloat16
  te.image_token_id: 151655
  te.model_type: qwen3_vl
  te.text_config:
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 151643
    dtype: float32
    eos_token_id: 151645
    head_dim: 128
    hidden_act: silu
    hidden_size: 2048
    initializer_range: 0.02
    intermediate_size: 6144
    max_position_embeddings: 262144
    model_type: qwen3_vl_text
    num_attention_heads: 16
    num_hidden_layers: 28
    num_key_value_heads: 8
    rms_norm_eps: 1.0e-06
    rope_scaling:
      mrope_interleaved: true
      mrope_section:
      - 24
      - 20
      - 20
      rope_type: default
    rope_theta: 5000000
    tie_word_embeddings: true
    use_cache: true
    vocab_size: 151936
  te.text_config.attention_bias: false
  te.text_config.attention_dropout: 0.0
  te.text_config.bos_token_id: 151643
  te.text_config.dtype: float32
  te.text_config.eos_token_id: 151645
