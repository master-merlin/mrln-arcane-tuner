id: krea2-raw
family: krea2
name: Krea-2 Raw
version: '1.0'
control_inputs: 0
defaults:
  resolution: 1024
  scheduler: flow_match
  learning_rate: 1e-5
  is_distilled: false
components:
  repo:
    path: huggingface:krea/Krea-2-Raw
    type: diffusers
    params: {}
detected_precision:
  text_encoder: torch.bfloat16
  vae: torch.bfloat16
  unet: torch.bfloat16
architecture_params:
  transformer._class_name: Krea2Transformer2DModel
  transformer.attention_head_dim: 128
  transformer.axes_dims_rope:
  - 32
  - 48
  - 48
  transformer.in_channels: 64
  transformer.intermediate_size: 16384
  transformer.norm_eps: 1.0e-05
  transformer.num_attention_heads: 48
  transformer.num_key_value_heads: 12
  transformer.num_layers: 28
  transformer.num_layerwise_text_blocks: 2
  transformer.num_refiner_text_blocks: 2
  transformer.num_text_layers: 12
  transformer.rope_theta: 1000.0
  transformer.text_hidden_dim: 2560
  transformer.text_intermediate_size: 6912
  transformer.text_num_attention_heads: 20
  transformer.text_num_key_value_heads: 20
  transformer.timestep_embed_dim: 256
  transformer.out_channels: 64
  transformer.patch_size: 2
  vae._class_name: AutoencoderKLQwenImage
  vae.latent_channels: 16
  vae.vae_scale_factor: 8
  te.type: qwen3_vl
  te.architectures:
  - Qwen3VLModel
  te.text_encoder_select_layers:
  - 2
  - 5
  - 8
  - 11
  - 14
  - 17
  - 20
  - 23
  - 26
  - 29
  - 32
  - 35
  scheduler._class_name: FlowMatchEulerDiscreteScheduler
  scheduler.use_dynamic_shifting: true
  scheduler.shift: 1.0
