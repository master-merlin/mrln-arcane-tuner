  te.text_config.rms_norm_eps: 1.0e-06
  te.text_config.rope_scaling:
    mrope_interleaved: true
    mrope_section:
    - 24
    - 20
    - 20
    rope_type: default
  te.text_config.rope_scaling.mrope_interleaved: true
  te.text_config.rope_scaling.mrope_section:
  - 24
  - 20
  - 20
  te.text_config.rope_scaling.rope_type: default
  te.text_config.rope_theta: 5000000
  te.text_config.tie_word_embeddings: true
  te.text_config.use_cache: true
  te.text_config.vocab_size: 151936
  te.video_token_id: 151656
  te.vision_config:
    deepstack_visual_indexes:
    - 5
    - 11
    - 17
    depth: 24
    dtype: float32
    hidden_act: gelu_pytorch_tanh
    hidden_size: 1024
    in_channels: 3
    initializer_range: 0.02
    intermediate_size: 4096
    model_type: qwen3_vl
    num_heads: 16
    num_position_embeddings: 2304
    out_hidden_size: 2048
    patch_size: 16
    spatial_merge_size: 2
    temporal_patch_size: 2
  te.vision_config.deepstack_visual_indexes:
  - 5
  - 11
  - 17
  te.vision_config.depth: 24
  te.vision_config.dtype: float32
  te.vision_config.hidden_act: gelu_pytorch_tanh
  te.vision_config.hidden_size: 1024
  te.vision_config.in_channels: 3
  te.vision_config.initializer_range: 0.02
  te.vision_config.intermediate_size: 4096
  te.vision_config.model_type: qwen3_vl
  te.vision_config.num_heads: 16
  te.vision_config.num_position_embeddings: 2304
  te.vision_config.out_hidden_size: 2048
  te.vision_config.patch_size: 16
