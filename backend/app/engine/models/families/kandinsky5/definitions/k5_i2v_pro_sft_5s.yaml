# Curated LoRA target surface (600 modules = 1200 lora_A/B keys —
# pinned by test_kandinsky5_lora_portability): the driver's own fully-indexed
# expansion of K5_LORA_TARGET_SUFFIXES over the 60 visual_transformer_blocks,
# verified as Linears on the meta-instantiated real config. VISUAL blocks
# only — text_transformer_blocks share the same sub-module names and must
# stay frozen.
# MUST stay non-empty: registry.enrich_definition only auto-fills an
# EMPTY list, and the introspector's exhaustive Linear catalog (text
# blocks, time embedder, ...) would otherwise replace this curated
# surface at first model load (dreamlite 2026-07-08 precedent).
