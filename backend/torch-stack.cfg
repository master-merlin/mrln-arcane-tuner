# The torch stack: the ONE place its versions live. Every installer reads it through
# torch_stack.py, and a test holds requirements.txt's pins equal to the default set.
#
# Each set is published on download.pytorch.org/whl/<set>/ as one tested combination.
# torch and torchaudio must come from the same index: `import torchaudio` raises when its
# CUDA major.minor differs from torch's.
#
# DRIVER_MIN: the lowest NVIDIA driver branch the set runs on. CUDA 13.x runs on R580+ by
# minor-version compatibility, CUDA 12.x on R525+; the cu126 floor is the CUDA 12.6
# toolkit's own R560.
# ARCHS: torch.cuda.get_arch_list() of the set's Windows torch wheel, MEASURED 2026-11-09 in a
# throwaway venv. PyTorch's RELEASE.md lists the same for 2.15 on Linux x86 and Windows.
# Neither wheel carries PTX, so a GPU fits a set only through SASS binary compatibility: an
# sm_XZ with the GPU's own major X and Z <= its minor.
#
# torchao: on Linux it comes from the set's own index, which publishes a build per CUDA
# (PyPI's Linux wheel carries CUDA-13 extensions only). On Windows it comes from PyPI,
# whose Windows wheel is pure python (the CUDA indexes publish none for Windows); torch's
# kernels serve every scheme we offer there.

DEFAULT=cu132
SETS=cu132 cu126

CU132_TORCH=2.15.0
CU132_TORCHVISION=0.29.2
CU132_TORCHAUDIO=2.11.1
CU132_TORCHAO=0.18.0
CU132_TRITON=3.9.0
CU132_TRITON_WINDOWS=3.9.0.post30
CU132_DRIVER_MIN=580
CU132_ARCHS=75 80 86 90 100 120

CU126_TORCH=2.14.1
CU126_TORCHVISION=0.29.1
CU126_TORCHAUDIO=2.11.0
CU126_TORCHAO=0.18.0
CU126_TRITON=3.8.0
CU126_TRITON_WINDOWS=3.8.0.post29
CU126_DRIVER_MIN=560
CU126_ARCHS=50 60 61 70 75 80 86 90

# The CPU set (CI, and machines without an NVIDIA GPU): the default set's versions from the
# CPU index (download.pytorch.org/whl/cpu).
