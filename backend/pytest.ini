[pytest]
; Belt-and-braces (audit P0 item 0.6): importlib import mode tolerates
; same-named test modules in different packages even if an __init__.py is
; ever missing again, instead of aborting the whole collection with an
; "import file mismatch" error.
addopts = --import-mode=importlib

; There are THREE test roots, each with its own conftest.py. Naming them here
; means a bare `pytest` (from backend/) collects all three, instead of relying
; on every caller remembering the full list — `app/api/tests` had been missing
; from the documented gate command, so its tests were never part of "the gate
; is green". A bare `pytest` must not be left to default to rootdir discovery
; either: that recurses into venv/ and collects thousands of third-party tests.
; Explicit path arguments still override this.
testpaths = tests app/engine/tests app/api/tests

; ── Suppress pytest's OWN assertion-rewriter deprecation noise ───────────
;
; MEASURED, not guessed. A full run on a cold `__pycache__` reported 125,429
; warnings, of which 125,247 — 99.85%, across twelve lines of ONE third-party
; module — came from `_pytest/assertion/rewrite.py`. The residual, i.e. every
; warning this project is actually responsible for, was 182.
;
; pytest rewrites assertions in test modules at import and caches the result in
; `__pycache__`; while rewriting, it builds `ast.Str`/`ast.Num` nodes that
; Python 3.12 deprecates. A WARM cache loads the rewritten bytecode and the
; rewriter never runs, so the warnings vanish. That makes the total a property
; of the working directory's bytecode cache rather than of the code: the same
; tree, same command, same commit gives 6 warnings warm and 988 cold on an
; 84-test subset — a 165x swing, reproducible on demand in both directions.
; A fresh worktree is cold by construction, so a clean fork's first gate run
; reported six figures and a real 700x "divergence" between two branches was
; chased as a defect. Without this filter the warning count is not a signal.
;
; THIS IS A WORKAROUND; THE FIX IS THE UPGRADE. The warnings come from
; `pytest==7.2.0` (requirements.txt:87). Modern pytest does not emit them at
; all. The bump is a dependency decision with real churn risk — pytest-asyncio
; and pytest-split are both version-coupled to it — so it is filed as its own
; lane for the user to take deliberately, not absorbed here while chasing a
; warning count. When that lands, DELETE this block rather than keeping it.
;
; Narrow on BOTH axes on purpose. The module qualifier is load-bearing, not
; decoration: `ast.Str is deprecated` also occurs outside the rewriter, and a
; message-only ignore would hide it there too. Equally, a module-only ignore
; would swallow the next genuinely different thing that module says — that is
; how a filter stops being a filter and becomes a blindfold. Four message
; texts are covered because four is what the run contains; `Attribute s` was
; missed by a hand-written list of three and found by enumerating the output.
filterwarnings =
    ignore:ast\.[A-Za-z]+ is deprecated:DeprecationWarning:_pytest.assertion.rewrite
    ignore:Attribute [a-z]+ is deprecated:DeprecationWarning:_pytest.assertion.rewrite
