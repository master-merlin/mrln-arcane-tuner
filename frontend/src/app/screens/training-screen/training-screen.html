<div class="training-grid">

    <!-- ── LEFT · Sections TOC (bordered bar, not a card — per Hi-Fi) ── -->
    <aside class="ts-toc">
        <app-training-toc
            [segments]="segments()"
            [activeId]="activeSection()"
            (jump)="onJump($event)"/>
    </aside>

    <!-- ── CENTER · Page head + dynamic config form ───────────────── -->
    <main class="ts-form-pane" #formPane (scroll)="onPaneScroll()">
        <div class="page-head ts-page-head">
            <div>
                <div class="eyebrow">CONFIGURE</div>
                <h1 class="page-title">Training</h1>
                <p class="page-sub">Set up and queue a training run.</p>
            </div>
        </div>

        @if (currentSchema()) {
            <app-training-dynamic-config
                [schema]="currentSchema()"
                [availableModels]="availableModels()"
                [projectId]="scope.projectId()"
                (segmentsChanged)="onSegmentsChanged($event)"
                (vramReportChanged)="onVramReport($event)"
                (configSubmitted)="queueJob($event)"/>
        } @else if (availableModels().length === 0) {
            <p class="muted ts-empty">Loading available models…</p>
        } @else {
            <p class="muted ts-empty">Loading training configuration…</p>
        }
    </main>

    <!-- ── RIGHT · Live Estimate rail ─────────────────────────────── -->
    <aside class="ts-estimate-rail card">
        <div class="card-body ts-estimate-body">
            <app-training-estimate-rail [report]="vramReport()"/>
        </div>
    </aside>

</div>
