# MiniMax-H3 — 33B dense single-stream omni-modal DiT (video + stereo audio
# denoised JOINTLY in one pass). MiniMax H3 Community License (NOT Apache-2.0).
#
# Model classes are the INSTALLED diffusers ones (0.40.0 ships the whole H3
# stack; the earlier vendored fork was retired in plan row 1.8 of PR1).
#
# All architecture_params verified against the live HF repo
# (MiniMaxAI/MiniMax-H3, 2026-08-05): transformer/config.json, vae/config.json,
# audio_vae/config.json — fetched via the raw endpoints, no download needed.
id: minimax-h3-ref2va
family: minimax_h3
name: MiniMax H3 (reference -> video+audio)
version: '1.0'
# GATED OUT OF USER-FACING ENUMERATION (ECOSYSTEM §6 `unavailable_reason`,
# DECISION-26 (a), 2026-08-31). PER-DEFINITION on purpose: each of the three
# minimax_h3 definitions is gated for its OWN reasons and CLEARS INDEPENDENTLY
# of the other two — deleting this key here offers this definition again and
# changes nothing for its siblings. Do NOT collapse the three into one shared
# family-level string; `test_definition_availability_gate.py` pins that they
# stay distinct. The code, tests and this file stay in
# the tree meanwhile, and the registry-wide coverage sweeps keep enumerating
# the family.
#
# ref2va has a defect of its own: reference conditioning is UNBUILT, not
# unanswerable -- see `unavailable_reason` below and
# `_harness/research/minimax-h3-context-ir.md` (Verdict: NOT REQUIRED); those
# two are the ONE statement of why this definition is gated, and
# `test_definition_availability_gate.py::test_ref2va_reason_is_true_today`
# pins its meaning. As with fl2va, `mode: both` is the only thing separating
# this from plain text-to-video. This definition may therefore stay gated
# after the other two clear, and must not be swept back in alongside them.
unavailable_reason: >-
  Reference conditioning is not built: the reference-block packing path
  (reference images, videos and audio on their own grids sharing the media
  clock) is unwritten in this family and the ref2va checkpoint has not been
  validated by a gate -- use minimax-h3-t2va (or fl2va once first/last-frame
  conditioning lands). Every model component this path needs is published;
  upstream's hosted H3-Context-IR service expands prompts and is not part of
  the model. It returns when the reference packing path is built and measured.
# Run-config surfaces (plan row 3.3): the two sigma shifts and the CFG
# augmentation scale are gated by these flags in archetypes._FIELD_RULES.
capability_overrides:
  supports_dual_sigma_shift: true
  supports_cfg_augmentation: true
defaults:
  resolution: 768
  scheduler: flow_match
  learning_rate: 1e-4
  train_audio: true
  # 107 frames satisfies 17n+5 (n=6) — ~4.46s @ 24fps, and the same default
  # ai-toolkit's UI ships. NOT the model's 345-frame ceiling: attention is
  # dense (sparse attention was not shipped with the weights), so 107 frames
  # is ~18.8K tokens where 345 is ~59.9K. See spec section 5.
  num_frames: 107
components:
  repo:
    path: huggingface:MiniMaxAI/MiniMax-H3
    type: diffusers
    params: {}
# Deliberately 0, NOT an oversight. ref2va's reference-conditioning
# mechanism is not yet built -- reference-block packing, see
# `unavailable_reason`. control_inputs > 0 activates the
# paired-edit-dataset gating in pipeline_data.py, built for a mechanism this
# definition does not implement; flipping it on here would silently route
# training through a pipeline that does not match the model. PR4 owns this
# when the reference packing path lands; the Context-IR question is settled
# (research `minimax-h3-context-ir.md`).
control_inputs: 0
detected_precision:
  text_encoder: torch.bfloat16
  vae: torch.bfloat16
  unet: torch.bfloat16
architecture_params:
  mode: both
  has_audio: true
  # The ONLY lever separating the modalities: H3 is single-stream, so audio
  # and video traverse the same attn/FFN and cannot be targeted separately.
  audio.loss_weight: 0.1
  # CFG-augmented training (research §3.7): the loss is taken on
  # (out + (s-1)*out_uncond)/s so the LoRA learns the guided output the
  # sampler actually produces. Ships OFF (1.0): GATE-3 (plan row 3.4,
  # revision 25) rejected 4.0 as a default - at its equal 4 x 300-step budget
  # the scale-4.0 run missed the row's loss line (ratio 0.306 >= 0.20). The
  # run-config key `cfg_augment_scale` switches it on (None = this value).
  cfg_augment.scale: 1.0
  audio.sampling_rate: 32000
  audio.latent_rate: 40
  audio.channels: 2
  # Two COUPLED sigma schedules, not one. Verified in ai-toolkit packing.py
  # (VIDEO_SIGMA_SHIFT / AUDIO_SIGMA_SHIFT) and in diffusers' H3 scheduler.
  # One u is sampled per step and mapped through BOTH curves.
  audio.sigma_shift: 3.0
  video.sigma_shift: 12.0
  # RAW VAE factor. The transformer's 2x patchify is declared separately via
  # video.divisibility — WAN declares 8 with a 2x2 patchify, LTX-2 declares 32
  # with patch_size 1. Declaring 32 here would double-count the patchify.
  video.vae_spatial: 16
  video.vae_temporal: 4
  video.divisibility: 32
  # 17n+5, NOT 4n+1. The VAE chunks 17 pixel frames -> 5 latent frames
  # (vae/config.json clip_length: 17), so the naive (F-1)/4+1 derivation from
  # the 4x temporal factor is WRONG. Latent frames = (F-5)//17*5 + 2.
  # Cross-confirmed by ai-toolkit packing.py, DiffSynth (raises on
  # num_frames % 17 != 5) and musubi ("124 through 345 in steps of 17").
  # Requires the Nn+M frame-rule generalization from Task 3B.
  video.frame_rule: 17n+5
  video.frame_rate: 24.0
  video.short_edge: 768
  video.max_pixels: 1032192   # 768 * 1344 canvas cap
  # -- Transformer (transformer/config.json) --
  transformer._class_name: MiniMaxH3Transformer3DModel
  # ref2va reads a SEPARATE 33B checkpoint — a second full download beyond
  # transformer/, with the same class, config and key set. Upstream's hosted
  # H3-Context-IR service sits outside the conditioning path (research
  # `minimax-h3-context-ir.md`, Verdict: NOT REQUIRED); this definition makes
  # no claim about reference-conditioning fidelity.
  transformer.subfolder: transformer_ref
  transformer.num_attention_heads: 56
  transformer.attention_head_dim: 128
  # NOTE 56 x 128 = 7168 != hidden_size 5376. QKV projections are NOT square.
  transformer.hidden_size: 5376
  transformer.num_layers: 50
  transformer.num_refiner_layers: 2
  transformer.ffn_dim: 14336
  # float32 residual stream, MEASURED (gate5-memprofile.json, commit 7cabd483) - see
  # minimax_h3_t2va.yaml. Reader: vram_estimator._token_inventory_activations_mb.
  transformer.residual_stream_dtype: float32
  transformer.in_channels: 24
  transformer.audio_in_channels: 32
  transformer.patch_size:
  - 1
  - 2
  - 2
  transformer.text_dim: 5120
  transformer.freq_dim: 256
  transformer.time_embed_hidden_dim: 5376
  transformer.time_embed_dim: 2688
  transformer.rope_freq_dim: 16
  transformer.rope_theta: 10000.0
  transformer.norm_eps: 1.0e-05
  transformer.qk_norm_eps: 1.0e-05
  transformer.final_norm_eps: 1.0e-05
  # -- Visual VAE (vae/config.json) --
  vae._class_name: AutoencoderKLMiniMaxH3
  vae.latent_channels: 24
  vae.spatial_downsample_factors:
  - 2
  - 2
  - 2
  - 2
  - 1
  - 1
  vae.temporal_downsample_factors:
  - 1
  - 2
  - 2
  - 1
  - 1
  - 1
  vae.clip_length: 17
  vae.token_drop: 3
  # -- Audio VAE (audio_vae/config.json) — MONO. Stereo is produced by running
  #    it once PER CHANNEL; never hand it a 2-channel tensor.
  audio_vae._class_name: AutoencoderKLMiniMaxH3Audio
  audio_vae.latent_channels: 32
  audio_vae.encoder_rates:
  - 2
  - 4
  - 4
  - 5
  - 5
  audio_vae.sampling_rate: 32000
  # -- Text encoder (text_encoder/config.json) — Qwen3-VL-32B, ~66.7 GB bf16
  #    on disk (66,714,780,128 bytes,
  #    text_encoder/model.safetensors.index.json metadata.total_size,
  #    fetched 2026-08-10) — corrected from an earlier "48 GB" here that was
  #    simply wrong: 32B params at bf16 alone is already ~64 GB, and no
  #    truncated/repackaged 48 GB variant of this repo was found on HF; the
  #    old figure was an uncredited approximation, not a measurement.
  #    Cached then UNLOADED before the DiT loads; never coexists with it.
  te.type: qwen3_vl
  te.hidden_size: 5120
  # Hidden states are tapped at layer 50, NOT the last layer.
  te.hidden_state_tap_index: 50
  # Prompt tokens are capped at 512 (raw tokens, no chat template) —
  # ai-toolkit's evidenced default (research §5, `d20a17c1`); vision
  # blocks (PR1b keyframes) are never cut, only the caption tail.
  te.max_length: 512
  # Generic activation-estimate hints
