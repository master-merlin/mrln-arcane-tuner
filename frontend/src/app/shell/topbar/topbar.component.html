<div class="topbar">
    <div class="crumbs">
        @for (c of crumbs(); track $index; let i = $index) {
            @if (i > 0) { <span class="sep" aria-hidden="true">›</span> }
            <span class="seg" [class.last]="c.last">{{ c.label }}</span>
        }
    </div>

    @if (showScope()) {
        <div style="margin-left: 14px;">
            <app-context-switcher />
        </div>
    }

    <div class="topbar-actions">
        <app-task-center />
        <app-download-indicator />
        <app-notification-panel />
        @if (llm.available()) {
            <button class="icon-btn" type="button"
                    title="LLM endpoint reachable — open Server settings"
                    aria-label="LLM endpoint reachable"
                    (click)="goServer()">
                <app-ico name="Bot" [size]="15" />
            </button>
        }
        <button
            class="icon-btn"
            type="button"
            [title]="themeLabel()"
            [attr.aria-label]="themeLabel()"
            (click)="theme.toggle()"
        >
            <app-ico [name]="themeIcon()" [size]="15" />
        </button>
    </div>
</div>
