[pytest]
; Belt-and-braces (audit P0 item 0.6): importlib import mode tolerates
; same-named test modules in different packages even if an __init__.py is
; ever missing again, instead of aborting the whole collection with an
; "import file mismatch" error.
addopts = --import-mode=importlib

; There are THREE test roots, each with its own conftest.py. Naming them here
; means a bare `pytest` (from backend/) collects all three, instead of relying
; on every caller remembering the full list — `app/api/tests` had been missing
; from the documented gate command, so its tests were never part of "the gate
; is green". A bare `pytest` must not be left to default to rootdir discovery
; either: that recurses into venv/ and collects thousands of third-party tests.
; Explicit path arguments still override this.
testpaths = tests app/engine/tests app/api/tests

; ── asyncio ──────────────────────────────────────────────────────────────
; Strict mode (the 1.x default) is what this suite already assumes: every
; async test carries an explicit `@pytest.mark.asyncio`.
;
; The loop scope is declared rather than left to default because pytest-asyncio
; 1.x warns once per session when it is unset, and an unexplained warning in a
; gate report is exactly the noise this file spent a lane learning to avoid.
; `function` keeps the pre-1.x behaviour: a fresh loop per test, so one test's
; leftover tasks cannot reach another's.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

; NOTE FOR ANYONE LOOKING FOR THE ASSERTION-REWRITER WARNING FILTER: it was
; deleted with `pytest==7.2.0`, which is what emitted those warnings — 125,247
; of 125,429 on a cold `__pycache__`, from `_pytest/assertion/rewrite.py`
; building `ast.Str`/`ast.Num` nodes Python 3.12 deprecates. pytest 9 does not
; emit them at all: measured 187 warnings against a 186 control, cold cache,
; filter absent. The suppression and its contract test were removed together
; in the same commit as the bump, because a filter whose cause is gone is how
; a codebase acquires suppressions nobody can justify. Do not reintroduce it.
