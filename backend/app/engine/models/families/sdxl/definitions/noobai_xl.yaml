id: noobai-xl-v1.1
family: sdxl
name: NoobAI-XL v1.1
version: '1.1'
defaults:
  # Anime/booru SDXL fine-tune (Laxhar Studio), trained from Illustrious v0.1
  # on a large Danbooru/e621-tagged corpus. This is the FINAL epsilon-
  # prediction release in the eps line (noobai-XL-0.6 -> 0.77 -> 1.0 -> 1.1);
  # Laxhar's parallel V-Pred line (noobai-XL-Vpred-1.0 et al) is a separately
  # trained checkpoint family, NOT interchangeable with this one -- and
  # regardless, this family cannot correctly run a v-pred checkpoint yet:
  # SDXLTrainer.compute_target hardcodes the epsilon objective (no v-pred
  # branch), so a v-pred definition would silently train the wrong target.
  # License: fair-ai-public-license-1.0-sd (repo tag `license:other`;
  # resolved via the model card/README on huggingface.co/Laxhar/noobai-XL-1.1).
  resolution: 1024
  scheduler: euler_a
  learning_rate: 1e-4
  # Community default for NoobAI-lineage checkpoints mirrors Illustrious:
  # CFG ~5-7 (SDXL base's 5.0 works cleanly; slightly higher CFG sharpens
  # anime line/detail).
  num_inference_steps: 28
  guidance_scale: 6.0
components:
  unet:
    # Official Laxhar/noobai-XL-1.1 diffusers-layout repo (first-party --
    # NOT a third-party mirror). The same HF repo also ships the official
    # single-file NoobAI-XL-v1.1.safetensors checkpoint alongside this
    # diffusers layout; a from_single_file() conversion of that single-file
    # was compared tensor-by-tensor against this repo's unet/text_encoder/
    # text_encoder_2/vae and found identical (see A3 report). Prediction
    # type confirmed epsilon (scheduler/scheduler_config.json), fair-ai-
    # public-license-1.0-sd.
    path: huggingface:Laxhar/noobai-XL-1.1
    type: diffusers
    params: {}
  vae:
    # NoobAI ships its OWN vae/ subfolder in this same repo -- unlike
    # sdxl_base/illustrious, which override with madebyollin/sdxl-vae-fp16-
    # fix. Verified instead of assumed: NoobAI's shipped vae weights are
    # numerically ~equal to madebyollin/sdxl-vae-fp16-fix (max tensor diff
    # 0.140, 199/248 tensors within 1e-2 -- consistent with fp16-storage
    # rounding of the SAME fix) and clearly NOT the original unstable
    # stabilityai vae (max diff 55.4, only 4/248 tensors within 1e-2).
    # Laxhar already baked the fp16 fix in, so the checkpoint's own vae/ is
    # kept (no override needed).
    path: huggingface:Laxhar/noobai-XL-1.1
    type: diffusers
    params: {}
detected_precision:
  unet: torch.float32
  text_encoder_1: torch.float32
  text_encoder_2: torch.float32
  vae: torch.float32
