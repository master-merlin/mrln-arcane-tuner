# FLUX.3 Image Klein Base (LANE-144). The undistilled 5.6B base -- the checkpoint Black Forest Labs
# names for LoRA training. The step-distilled `flux-3-image-klein` (flow map) is refused by the loader.
# architecture_params mirror the checkpoint's own transformer/config.json
# (snapshot 1469d27cfb9bb1bd81d3a93f5a023b39dbf136e4), which equals the vendored class's defaults.
id: flux3-image-klein-base
family: flux3
name: FLUX.3 Image Klein (Base)
version: '1.0'
# FLUX Kommunity License v1.0, gated on HuggingFace. Tracked in the README "licensed separately"
# table (the `flux3` row), never here or in the app (RULE-21; the README link reads the repo below).
defaults:
  resolution: 1024
  scheduler: flow_match
  # Assumption (LANE-144): a conventional LoRA learning rate for a ~6B DiT; judged at the GPU UAT.
  learning_rate: 1e-4
  # The base model's inference defaults (BFL reference: 50 steps, real CFG 3.5, 1024x1024).
  num_inference_steps: 50
  guidance_scale: 3.5
  is_distilled: false
components:
  repo:
    path: huggingface:black-forest-labs/flux-3-image-klein-base
    type: diffusers
    params: {}
control_inputs: 0
# bf16 on-disk sizes from the repo's file listing (_harness/research/flux3-klein.md source S2).
model_size_mb:
  transformer: 11080
  text_encoder: 8880
  vae: 340
detected_precision:
  text_encoder: torch.bfloat16
  vae: torch.bfloat16
  unet: torch.bfloat16
architecture_params:
  transformer._class_name: Flux3Transformer2DModel
  transformer.in_channels: 128
  transformer.num_layers: 5
  transformer.num_single_layers: 28
  transformer.attention_head_dim: 128
  transformer.num_attention_heads: 24
  transformer.hidden_size: 3072
  transformer.joint_attention_dim: 20480
  transformer.mlp_ratio: 3.0
  transformer.flow_map: false
  vae._class_name: AutoencoderKLFlux2
  te.type: qwen3_vl
  te.model_type: qwen3_vl
  # Spec D3: hidden states of Qwen3-VL layers 4, 8, ..., 32 stacked to 20480 per token, the text
  # window a multiple of 80 tokens capped at te.max_length.
  te.select_layers: [4, 8, 12, 16, 20, 24, 28, 32]
  te.max_length: 512
  # Spec D3: the FIXED flow-match schedule t' = a*t / (1 + (a-1)*t) with a = 6.93 -- a property of
  # the checkpoint (reference trainer FLOW_SHIFT), not resolution-dependent and not a user knob.
  scheduler.shift: 6.93
  scheduler.use_dynamic_shifting: false
# Spec D4: the six leaves of the 38 blocks a text-to-image step executes (5 image + 5 text mode
# blocks, 28 single blocks) = 228, in BFL-native names. The diffusers converter
# (`_convert_non_diffusers_flux3_lora_to_diffusers`, PR #15046 ec288418 lora_conversion_utils.py:2554)
# maps `content_mode_blocks.` -> `mode_blocks.`, `single_blocks.` -> `single_transformer_blocks.`,
# q_proj/k_proj/v_proj -> attn.to_q/k/v, attn_out -> attn.to_out.0, mlp_in/mlp_out -> ff.linear_in/out.
# The `image_cond` mode blocks are excluded: they run only with reference images (out of scope).
lora_targetable_modules:
- content_mode_blocks.image.0.q_proj
- content_mode_blocks.image.0.k_proj
- content_mode_blocks.image.0.v_proj
- content_mode_blocks.image.0.attn_out
- content_mode_blocks.image.0.mlp_in
- content_mode_blocks.image.0.mlp_out
