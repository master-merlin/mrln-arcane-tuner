<div class="topbar">
    <div class="crumbs">
        @for (c of crumbs(); track $index; let i = $index) {
            @if (i > 0) { <span class="sep">/</span> }
            <span class="seg" [class.last]="c.last">{{ c.label }}</span>
        }
    </div>

    @if (showScope()) {
        <div style="margin-left: 14px;">
            <app-context-switcher />
        </div>
    }

    @if (!onDatasetsRoute()) {
        <div class="search" style="margin-left: auto;">
            <app-ico name="Search" [size]="13" />
            <input
                class="search-input"
                type="search"
                [placeholder]="searchPlaceholder()"
                [value]="search.query()"
                (input)="onSearchInput($event)"
            />
            @if (search.query()) {
                <button class="search-clear-btn"
                        type="button"
                        (click)="clearSearch()"
                        title="Clear search"
                        aria-label="Clear search">
                    <app-ico name="X" [size]="12" />
                </button>
            }
        </div>
    }
    <app-download-indicator />
    <button class="icon-btn" type="button">
        <app-ico name="Bell" [size]="15" />
    </button>
    <button class="icon-btn" type="button">
        <app-ico name="Settings" [size]="15" />
    </button>
</div>
