id: ovis-image-base
family: ovis_image
name: Ovis-Image 7B
version: '1.0'
defaults:
  resolution: 1024
  scheduler: flow_match
  learning_rate: 1e-4
  is_distilled: false
  # Native in-training-preview defaults, definition-sourced (W3-1). These are
  # OvisImagePipeline.__call__'s own defaults (pipeline_ovis_image.py:463/466
  # in diffusers 0.39) — NOT the generic base's 20 steps / 3.5 guidance, which
  # under the dynamic-shifted schedule (mu=1.15 at 1024^2) starve the low-sigma
  # detail region (2026-07-10 UAT: coherent but detail-free samples). The
  # sampler reads these; the Python constants in sampler.py are fallbacks only.
  num_inference_steps: 50
  guidance_scale: 5.0
components:
  repo:
    path: huggingface:AIDC-AI/Ovis-Image-7B
    type: diffusers
    params: {}
control_inputs: 0
detected_precision:
  text_encoder: torch.bfloat16
  vae: torch.bfloat16
  unet: torch.bfloat16
# model_size_mb intentionally empty — the VRAM estimator falls back to the
# meta-instantiated param counts in _FAMILY_PARAMS["ovis_image"].
architecture_params:
  # -- Transformer (checkpoint transformer/config.json == diffusers 0.39
  #    OvisImageTransformer2DModel defaults) --
  transformer._class_name: OvisImageTransformer2DModel
  transformer.patch_size: 1
  transformer.in_channels: 64
  transformer.out_channels:
  transformer.num_layers: 6
  transformer.num_single_layers: 27
  transformer.attention_head_dim: 128
  transformer.num_attention_heads: 24
  transformer.joint_attention_dim: 2048
  transformer.axes_dims_rope:
  - 16
  - 56
  - 56
  transformer.supports_cfg: true
  transformer.supports_negative_prompt: true
  # Generic activation-estimate hints (inner dim = 24 * 128, 6 + 27 blocks)
  hidden_size: 3072
  depth: 6
  in_channels: 64
  # -- Text encoder (checkpoint text_encoder/config.json: Qwen3, ~1.7B) --
  te.type: qwen3
  te.architectures:
  - Qwen3Model
  te.hidden_size: 2048
  te.intermediate_size: 6144
  te.num_hidden_layers: 28
  te.num_attention_heads: 16
  te.num_key_value_heads: 8
  te.head_dim: 128
  te.max_position_embeddings: 40960
  te.rope_theta: 1000000
  te.rms_norm_eps: 1.0e-06
  te.tie_word_embeddings: true
  te.vocab_size: 151936
  # OvisImagePipeline prompt-template contract:
  # max_length passed to the tokenizer = max_sequence_length + user_prompt_begin_id
  te.max_sequence_length: 256
  te.user_prompt_begin_id: 28
  # -- Scheduler (checkpoint scheduler/scheduler_config.json) --
  scheduler._class_name: FlowMatchEulerDiscreteScheduler
  scheduler.num_train_timesteps: 1000
  scheduler.shift: 3.0
  scheduler.use_dynamic_shifting: true
  scheduler.base_shift: 0.5
  scheduler.max_shift: 1.15
  scheduler.base_image_seq_len: 256
  scheduler.max_image_seq_len: 4096
  # -- VAE (checkpoint vae/config.json — Flux-style AutoencoderKL) --
  vae._class_name: AutoencoderKL
  vae.latent_channels: 16
  vae.vae_scale_factor: 8
  vae.scaling_factor: 0.3611
  vae.shift_factor: 0.1159
  vae.block_out_channels:
  - 128
  - 256
  - 512
  - 512
  vae.use_post_quant_conv: false
  vae.use_quant_conv: false
  num_heads: 24
  depth_single_blocks: 27
  context_dim: 2048
  te._attn_implementation_autoset: true
  te.attention_bias: false
  te.attention_dropout: 0.0
  te.bos_token_id: 151643
  te.dtype: float32
  te.eos_token_id: 151645
  te.hidden_act: silu
  te.initializer_range: 0.02
  te.layer_types:
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  - full_attention
  te.max_window_layers: 28
  te.model_type: qwen3
  te.rope_scaling:
  te.sliding_window:
  te.use_cache: true
  te.use_sliding_window: false
  vae.act_fn: silu
  vae.down_block_types:
  - DownEncoderBlock2D
  - DownEncoderBlock2D
  - DownEncoderBlock2D
  - DownEncoderBlock2D
  vae.force_upcast: true
  vae.in_channels: 3
  vae.latents_mean:
  vae.latents_std:
  vae.layers_per_block: 2
  vae.mid_block_add_attention: true
  vae.norm_num_groups: 32
  vae.out_channels: 3
  vae.sample_size: 1024
  vae.up_block_types:
  - UpDecoderBlock2D
  - UpDecoderBlock2D
  - UpDecoderBlock2D
  - UpDecoderBlock2D
  transformer.hidden_size: 3072
  te.concat_layers: 1
block_topology:
- name: double_blocks
  attr_path: transformer_blocks
  count: 6
  approx_vram_mb: 800
- name: single_blocks
  attr_path: single_transformer_blocks
  count: 27
  approx_vram_mb: 350
# Curated LoRA target surface (double + single stream projections, 207
# modules = 414 lora_A/B keys — pinned by test_ovis_image_lora_portability).
# Fully-expanded paths derived by meta-instantiating the real transformer
# config above; the top-level proj_out (final projection) is OMITTED, so
# the driver's exclude regex stays a no-op on this list.
# MUST stay non-empty: registry.enrich_definition only auto-fills an EMPTY
# list, and the introspector's exhaustive Linear catalog (time embedders,
# input/output projections, ...) would otherwise replace this curated
# surface at first model load (dreamlite 2026-07-08 precedent).
